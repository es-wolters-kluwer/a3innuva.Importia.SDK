name: Publish nuget
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish the packages'
        type: choice
        options:
          - all
          - nuget.org
          - artifactory
        default: all
      forceAlphaNuget:
        description: 'Publish alpha versions to nuget.org too'
        type: boolean
        default: false
jobs:
  Publish:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Setup .NET 10.0.x
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x 
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.x'
    - name: Set Version
      uses: gittools/actions/gitversion/execute@v4
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml
    - name: Show version
      run: |
        echo "Version: $GitVersion_SemVer (FullSemVer: $GitVersion_FullSemVer)"
        echo "PACKAGE_VERSION=$GitVersion_SemVer" >> "$GITHUB_ENV"
        echo "### Version generated: \`$GitVersion_SemVer\`" >> "$GITHUB_STEP_SUMMARY"
    - name: Restore dependencies
      run: dotnet restore        
    - name: Build
      run: dotnet build --configuration Release --no-restore /p:Version=$GitVersion_SemVer /p:FileVersion=$GitVersion_SemVer /p:AssemblyVersion=$GitVersion_MajorMinorPatch
    - name: Test
      run: dotnet test --no-build --verbosity normal --configuration Release 
    - name: Publish packages
      id: nugetorg
      if: ${{ inputs.target != 'artifactory' && (!contains(env.PACKAGE_VERSION, 'alpha') || inputs.forceAlphaNuget == true) }}
      continue-on-error: true
      run: dotnet nuget push **.nupkg --source nuget.org --api-key ${{secrets.NUGETORG_TOKEN}} --skip-duplicate
    - name: Publish packages to Artifactory
      id: artifactory
      if: ${{ inputs.target != 'nuget.org' }}
      continue-on-error: true
      env:
        ARTIFACTORY_NUGET_URL: ${{ secrets.ARTIFACTORY_NUGET_URL }}
        ARTIFACTORY_PUBLISH_WK_TOKEN: ${{ secrets.ARTIFACTORY_PUBLISH_WK_TOKEN }}
      run: |
        if [ -z "$ARTIFACTORY_NUGET_URL" ]; then
          echo "::error::ARTIFACTORY_NUGET_URL secret is not set."
          exit 1
        fi
        if [ -z "$ARTIFACTORY_PUBLISH_WK_TOKEN" ]; then
          echo "::error::ARTIFACTORY_PUBLISH_WK_TOKEN secret is not set."
          exit 1
        fi
        echo "Target URL host: $(echo "$ARTIFACTORY_NUGET_URL" | sed -E 's#^(https?://[^/]+).*#\1#')"
        mapfile -t packages < <(find . -name "*.nupkg" -path "*/bin/Release/*" -not -name "*.symbols.nupkg")
        if [ ${#packages[@]} -eq 0 ]; then
          echo "::error::No packages found to publish."
          exit 1
        fi
        echo "Found ${#packages[@]} package(s):"
        printf ' - %s\n' "${packages[@]}"
        failed=0
        : > "$RUNNER_TEMP/artifactory-results.md"
        for package in "${packages[@]}"; do
          name=$(basename "$package")
          size=$(stat -c%s "$package")
          echo "Uploading $name ($size bytes) to Artifactory"
          set +e
          status=$(curl -sS --show-error -o "$RUNNER_TEMP/artifactory-response.txt" -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $ARTIFACTORY_PUBLISH_WK_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$package" \
            "${ARTIFACTORY_NUGET_URL%/}/$name" 2> "$RUNNER_TEMP/artifactory-curl-error.txt")
          curl_exit=$?
          set -e
          echo "curl exit code: $curl_exit, HTTP status: ${status:-n/a}"
          if [ -s "$RUNNER_TEMP/artifactory-curl-error.txt" ]; then
            echo "curl error output:"
            cat "$RUNNER_TEMP/artifactory-curl-error.txt"
          fi
          if [ -s "$RUNNER_TEMP/artifactory-response.txt" ]; then
            echo "Server response:"
            cat "$RUNNER_TEMP/artifactory-response.txt"
            echo
          fi
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::curl failed uploading $name (exit code $curl_exit)"
            echo "| $name | ❌ curl error (exit $curl_exit) |" >> "$RUNNER_TEMP/artifactory-results.md"
            failed=1
            continue
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Upload of $name failed (HTTP $status)"
            echo "| $name | ❌ HTTP $status |" >> "$RUNNER_TEMP/artifactory-results.md"
            failed=1
            continue
          fi
          echo "Uploaded $name (HTTP $status)"
          echo "| $name | ✅ HTTP $status |" >> "$RUNNER_TEMP/artifactory-results.md"
        done
        exit $failed
    - name: Publication summary
      if: ${{ !cancelled() }}
      run: |
        icon() { case "$1" in success) echo "✅ Success";; failure) echo "❌ Failed";; skipped) echo "⏭️ Skipped";; *) echo "$1";; esac; }
        {
          echo "## Publication summary"
          echo "Version: \`$PACKAGE_VERSION\`"
          echo
          echo "| Destination | Result |"
          echo "|---|---|"
          echo "| nuget.org | $(icon '${{ steps.nugetorg.outcome }}')$([ '${{ steps.nugetorg.outcome }}' = skipped ] && echo ' (not selected, or alpha version without forceAlphaNuget)') |"
          echo "| Artifactory | $(icon '${{ steps.artifactory.outcome }}')$([ '${{ steps.artifactory.outcome }}' = skipped ] && echo ' (not selected)') |"
          if [ -s "$RUNNER_TEMP/artifactory-results.md" ]; then
            echo
            echo "### Artifactory packages"
            echo "| Package | Result |"
            echo "|---|---|"
            cat "$RUNNER_TEMP/artifactory-results.md"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "${{ steps.nugetorg.outcome }}" = "failure" ] || [ "${{ steps.artifactory.outcome }}" = "failure" ]; then
          echo "::error::At least one publication failed. See the summary for details."
          exit 1
        fi