workflow: GitHubFlow/v1
branches:
  main:
    regex: ^principal$
    label: beta
    increment: Minor
    is-release-branch: true
    is-main-branch: true
    source-branches:
      - feature
  release:
    label: ''
    increment: Minor
    regex: ^release?
    source-branches:
      - main
      - release
    is-release-branch: true
    is-main-branch: true
  feature:
    label: alpha
    increment: Inherit
    regex: ^feature?
    source-branches:
      - feature
      - hotfix
      - main
  pull-request:
    label: PR
    increment: Inherit
    source-branches:
      - main
      - release
      - feature
      - hotfix
  hotfix:
    regex: ^hotfix(es)?[/-]
    label: beta
    increment: Patch
    source-branches:
      - release
ignore:
  sha: []
merge-message-formats: {}