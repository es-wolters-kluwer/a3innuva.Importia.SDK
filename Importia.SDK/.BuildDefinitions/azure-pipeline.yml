pool:
  name: Azure Pipelines

variables:
  BuildConfiguration: 'Release'

trigger:
  branches:
    include:
      - principal

stages:
- stage: 'SonarQube_Analysis'
  condition: and(eq(variables['runSonarQube'], 'true'), succeeded())
  jobs:
 
  - job: Job_SonarQube_analysis
    displayName: 'SonarQube Analysis'
    condition: eq(variables['runSonarQube'], 'true')
    pool:
      vmImage: 'ubuntu-latest'
                
    steps:
      - checkout: self
        clean: true
        fetchDepth: 0

      - task: gitversion-setup@4
        displayName: 'Install GitTools'
        inputs:
          versionSpec: '6.x'

      - task: gitversion-execute@4
        displayName: 'Execute Git version'
        inputs:
          configFilePath: 'GitVersion.yml'
          buildNumberFormat: '${GitVersion_SemVer}'

      - bash: |
          echo "SemVer: $(GitVersion_SemVer)"
          echo "FullSemVer: $(GitVersion_FullSemVer)"
          echo "MajorMinorPatch: $(GitVersion_MajorMinorPatch)"
        displayName: 'Show calculated version'
      
      - task: SonarQubePrepare@8
        displayName: 'Prepare SonarQube Analysis'
        inputs:
          SonarQube: 'Sonar Qube EE'
          scannerMode: 'dotnet'
          projectKey: $(SonarQubeProjectName)
          projectName: $(SonarQubeProjectName)
          projectVersion : $(GitVersion_SemVer)
          extraProperties: |
            sonar.cs.vscoveragexml.reportsPaths=$(Agent.TempDirectory)/coverage/**/*.xml
            sonar.log.level=INFO
            sonar.exclusions=**/bin/**/*, **/obj/**/*, **/*.yml, **/*.yaml
            sonar.dotnet.excludeTestProjects=true
            sonar.projectBaseDir=$(Agent.BuildDirectory)

      - task: UseDotNet@2
        displayName: 'Use dotnet'
        inputs:
          packageType: 'sdk'
          version: '10.x'

      - task: DotNetCoreCLI@2
        displayName: 'dotnet restore'
        inputs:
          command: 'restore'
          projects: 'a3innuva.Importia.SDK.sln'
          noCache: true
          verbosityRestore : 'normal'

      - task: DotNetCoreCLI@2
        displayName: 'dotnet build'
        inputs:
          command: 'build'
          projects: 'a3innuva.Importia.SDK.sln'
          arguments: '--configuration $(BuildConfiguration) --no-restore'

      - task: DotNetCoreCLI@2
        displayName: 'dotnet test'
        inputs:
          command: 'test'
          projects: ''
          arguments: '--solution a3innuva.Importia.SDK.sln -c $(BuildConfiguration) --no-build --no-restore --coverage --coverage-output-format xml --results-directory $(Agent.TempDirectory)/coverage'
          publishTestResults: false
            
      - task: SonarQubeAnalyze@8
        displayName: 'SonarQube analyze'
        continueOnError: false
