trigger: none

schedules:
  - cron: '45 07 * * 0'
    displayName: Weekly BlackDuck Scan
    always: true
    branches:
      include:
        - develop

resources:
  repositories:
    - repository: pipelines
      type: git
      name: WKE Cross Components/Wke.Pipelines
      trigger: none

pool:
  name: Azure Pipelines
  vmImage: "ubuntu-latest"
  demands:
    - Java

variables:
  ## Constants
  BuildConfiguration: 'Release'

stages:
  - stage: 'Setup'
    jobs:

      - job: Setup
        displayName: 'Setup'
        pool:
          vmImage: 'ubuntu-latest'
        
        steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - task: gitversion-setup@4
            displayName: 'Install GitTools'
            inputs:
              versionSpec: '6.x'

          - task: gitversion-execute@4
            displayName: 'Execute Git version'
            inputs:
              configFilePath: 'GitVersion.yml'
              buildNumberFormat: '${GitVersion_SemVer}'

          - bash: |
              echo "SemVer: $(GitVersion_SemVer)"
              echo "FullSemVer: $(GitVersion_FullSemVer)"
              echo "MajorMinorPatch: $(GitVersion_MajorMinorPatch)"
            displayName: 'Show calculated version'

          - bash: |
              echo "##vso[task.setvariable variable=gitSemVersion;isOutput=true]$(GitVersion_SemVer)"
              echo "##vso[task.setvariable variable=gitMajorMinorVersion;isOutput=true]$(GitVersion_MajorMinorPatch)"
              echo "##vso[task.setvariable variable=gitAssemblySemVer;isOutput=true]$(GitVersion_AssemblySemVer)"     
            name: SetupVars

          - script: |
                echo "##vso[task.setVariable variable=path;isOutput=true]$(Agent.BuildDirectory)"
            displayName: Set artifactsPath
            name: artifactsPathCheck
              
  - template: /build/templates/backend/security/template-blackduck-net-base.yaml@pipelines
    parameters:
      blackDuckService: 'BlackDuck v10'
      projectName: $(ProjectName)
      nugetConfigPath: 'nuget.config'
      excludeFolders: '$(Agent.BuildDirectory)/Importia.SDK/Tests'
      excludeModules: '$(Agent.BuildDirectory)/Importia.SDK/Tests'
      bit: $(Bit)
      restoreSteps:
        - task: UseDotNet@2
          displayName: 'Use donet'
          inputs:
            packageType: 'sdk'
            version: '10.x'

        - task: DotNetCoreCLI@2
          displayName: 'dotnet restore'
          inputs:
            command: 'restore'
            projects: 'a3innuva.Importia.SDK.sln'
            noCache: true
            verbosityRestore: 'normal'

        - task: DotNetCoreCLI@2
          displayName: 'dotnet build'
          inputs:
            command: 'build'
            projects: 'a3innuva.Importia.SDK.sln'
            arguments: '--configuration $(BuildConfiguration) --no-restore'
            
  - template: /build/templates/backend/security/template-checkmarx.yml@pipelines
    parameters:
      bit: $(Bit)
      projectName: $(ProjectName)
